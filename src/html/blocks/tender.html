<div class="tender lenis" data-popup="tender" data-lenis-prevent>
  <div class="tender__inner">

    <div class="general__head">
      <div class="general__suptitle">
        пригласить
      </div>
      <div class="general__title">
        в тендер
      </div>
    </div>

    <form class="form" action="">
      <div class="form-inner">
        <div class="form-body form-col-2">
          <div class="form-group">
            <input id="tender_organization_input" class="form-input" type="text" name="tender_organization" required>
            <label class="form-label">
              <!-- организация -->

              <div class="typewriter" data-sync-group="tender" data-type-speed="0.07" data-type-variance="0.04"
                data-delete-speed="0.04" data-pause-after-type="2.0" data-pause-after-delete="0.5"
                data-input="#tender_organization_input" data-stop-text="Имя субъекта">
                <div class="typewriter__line">
                  <span class="typewriter__word" data-words="Давай знакомиться!|Сюда писать имя"></span>
                </div>
                <span class="typewriter__cursor">|</span>
              </div>

            </label>
          </div>
          <!-- <div class="form-group">
            <input id="tender_gorod_input" class="form-input" type="text" name="tender_gorod" required>
            <label class="form-label">
              <div class="typewriter" data-sync-group="tender" data-type-speed="0.07" data-type-variance="0.04"
                data-delete-speed="0.04" data-pause-after-type="2.0" data-pause-after-delete="0.5"
                data-input="#tender_gorod_input" data-stop-text="Город субъекта">
                <div class="typewriter__line">
                  <span class="typewriter__word" data-words="Откуда вы?|Сюда писать город"></span>
                </div>
                <span class="typewriter__cursor">|</span>
              </div>
            </label>
          </div> -->

          <div class="form-group">
            <div class="dropdown dropdown--js">
              <div class="dropdown__selected dropdown__selected--js">
                <input id="tender_gorod_input" class="form-input dropdown__input dropdown__selected-input--js" type="text"
                  name="tender_gorod" value="" required>
                <label class="form-label">
                  <div class="typewriter" data-sync-group="tender" data-type-speed="0.07" data-type-variance="0.04"
                    data-delete-speed="0.04" data-pause-after-type="2.0" data-pause-after-delete="0.5"
                    data-input="#tender_gorod_input" data-stop-text="Город субъекта">
                    <div class="typewriter__line">
                      <span class="typewriter__word" data-words="Откуда вы?|Сюда писать город"></span>
                    </div>
                    <span class="typewriter__cursor">|</span>
                  </div>
                </label>
                <!-- <label class="dropdown__label dropdown__selected-label--js"></label> -->
                <i class="icon-chevron-right"></i>
              </div>
              <div class="dropdown__container">
                <div class="dropdown__content">
                  <div class="dropdown__option">
                    <input id="place_1" class="dropdown__radio" name="place_name" type="radio" value="Новосибирск">
                    <label for="place_1" class="dropdown__label">Новосибирск</label>
                  </div>
                  <div class="dropdown__option">
                    <input id="place_2" class="dropdown__radio" name="place_name" type="radio" value="Москва">
                    <label for="place_2" class="dropdown__label">Москва</label>
                  </div>
                  <div class="dropdown__option">
                    <input id="place_3" class="dropdown__radio" name="place_name" type="radio" value="Санкт-Петербург">
                    <label for="place_3" class="dropdown__label">Санкт-Петербург</label>
                  </div>
                </div>
              </div>
              <input class="dropdown__value" type="hidden">
            </div>
          </div>

          <div class="form-group">
            <input id="tender_tel_input" class="form-input" type="tel" name="tender_tel" required>
            <label class="form-label">
              <!-- Телефон  -->

              <div class="typewriter" data-sync-group="tender" data-type-speed="0.07" data-type-variance="0.04"
                data-delete-speed="0.04" data-pause-after-type="2.0" data-pause-after-delete="0.5"
                data-input="#tender_tel_input" data-stop-text="КАНАЛ СВЯЗИ">
                <div class="typewriter__line">
                  <span class="typewriter__word" data-words="Номер телефона|Можно указать почту|Ждем обращения)"></span>
                </div>
                <span class="typewriter__cursor">|</span>
              </div>

            </label>
          </div>
          <div class="form-group">
            <input id="tender_email_input" class="form-input" type="email" name="tender_email" required>
            <label class="form-label">
              <!-- Электронная почта  -->

              <div class="typewriter" data-sync-group="tender" data-type-speed="0.07" data-type-variance="0.04"
                data-delete-speed="0.04" data-pause-after-type="2.0" data-pause-after-delete="0.5"
                data-input="#tender_email_input" data-stop-text="Электронная почта">
                <div class="typewriter__line">
                  <span class="typewriter__word"
                    data-words="Электронная почта|Можно указать почту|Ждем обращения)"></span>
                </div>
                <span class="typewriter__cursor">|</span>
              </div>

            </label>
          </div>
          <div class="form-group">
            <input id="tender_comments_input" class="form-input" type="text" name="tender_comments" required>
            <label class="form-label">
              <!-- ссылка на тендер или комментарий -->

              <div class="typewriter" data-sync-group="tender" data-type-speed="0.07" data-type-variance="0.04"
                data-delete-speed="0.04" data-pause-after-type="2.0" data-pause-after-delete="0.5"
                data-input="#tender_comments_input" data-stop-text="СУТЬ ОБРАЩЕНИЯ">
                <div class="typewriter__line">
                  <span class="typewriter__word"
                    data-words="суть нашего разговора|главная идея моего сообщения|основная цель"></span>
                </div>
                <span class="typewriter__cursor">|</span>
              </div>

            </label>
          </div>
        </div>
        <div class="form-mid">
          <div class="form-group">
            <div class="form-file">
              <label class="form-file-label">
                <input class="form-file-input" type="file" name="file_name">
                <div class="form-file-wrap">
                  <i class="icon-add-doc"></i>
                  <span>
                    Вложить документ (не более 50 мб)
                  </span>
                </div>
              </label>
              <div class="form-file-clear">
                <i class="icon-close"></i>
                Удалить
              </div>
            </div>
          </div>
        </div>
        <div class="form-foot">
          <button id="rocket-btn" class="form-btn" type="button" data-btn-sound="poehali">
            <div class="form-btn__text">
              поехали!
            </div>
          </button>
          <div class="form-wrap">
            <div class="form-text">
              Нажимая на кнопку «Отправить» вы соглашаетесь с <a href="/">Политикой обработки персональных данных</a>
            </div>
            <div class="form-group">
              <input id="tender-form-checkbox-1" class="form-checkbox" type="checkbox" data-btn-sound="shutdown_sound">
              <label for="tender-form-checkbox-1" class="form-checkbox-label">
                <div class="form-checkbox--item"></div>
                <div class="form-text">
                  Я согласен на обработку персональных данных
                </div>
              </label>
            </div>
            <div class="form-group">
              <input id="tender-form-checkbox-2" class="form-checkbox" type="checkbox" data-btn-sound="shutdown_sound">
              <label for="tender-form-checkbox-2" class="form-checkbox-label">
                <div class="form-checkbox--item"></div>
                <div class="form-text">
                  Я согласен на рекламные уведомления
                </div>
              </label>
            </div>
          </div>
        </div>
      </div>
    </form>

    <div class="tender__cover">
      <div class="tender__cover-img">
        <img id="rocket" src="./../../images/temp/raketa.webp" alt="">
      </div>
    </div>

  </div>

  <div class="tender__btn" data-popup-btn="tender">
    <span class="tender__btn-line tender__btn-line--first"></span>
    <span class="tender__btn-line tender__btn-line--second"></span>
  </div>
</div>
