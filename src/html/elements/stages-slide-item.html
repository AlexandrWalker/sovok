<div class="swiper-slide stages__slide">
  <div class="stages__item">
    <div class="stages__item-head">
      <div class="stages__item-img">
        <img src="@@img" alt="">
      </div>
    </div>
    <div class="stages__item-body">
      <div class="stages__item-count">
        @@count
      </div>
      <div class="stages__item-title">
        @@title
      </div>
      <div class="stages__item-text">
        @@text
      </div>
    </div>
  </div>
</div>
